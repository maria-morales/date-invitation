<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #FAEEE6;
        }
        #content {
            border: 1px solid transparent;
            background-color: #FFC0CB;
            border-radius: 12px;
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
            padding: 20px;
            text-align: center;
        }
        #yesButton, #noButton {
            font-size: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
            transition: 0.3s;
            padding: 15px;
            border: none;
            cursor: pointer;
            margin: 10px;
        }
        #yesButton {
            background-color: #4CAF50; /* Green */
            color: white;
        }
        #noButton {
            background-color: #f44336; /* Red */
            color: white;
        }
        #noButton:disabled {
            background-color: #ddd;
            color: #666;
            box-shadow: none;
        }
        #yesButton:hover, #noButton:hover {
            box-shadow: 0 12px 20px 0 rgba(0,0,0,0.24), 0 17px 50px 0 rgba(0,0,0,0.19);
        }

        .heart {
            position: fixed;
            top: -100px;
            width: 100px;
            height: 100px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23FF4D6D' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41 0.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>");
            animation: fall 4s linear infinite;     /* W3SCHOOL ANIMATION NG HEART */
        }

        @keyframes fall {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

    </style>
</head>
<body>
    <div id="content">
        <h2 id="question">Brendon, would you like to go on a date with me this Saturday, July 6th?</h2>
        <button id="yesButton">YES💕</button>
        <button id="noButton">NO😒</button>
        <p id="message"></p>
    </div>

    <script>

                document.getElementById('yesButton').style.fontSize = '30px';

            } else if (noClickCount == 3) {
                document.getElementById('yesButton').style.fontSize = '90px';
                this.style.fontSize = '7px';
            } else if (noClickCount == 4) {
                this.style.position = 'absolute';
                var padding = 100;

var container = document.getElementById('content');

var maxX = container.clientWidth - this.offsetWidth;
var maxY = container.clientHeight - this.offsetHeight;

this.style.position = 'absolute';
this.style.left = Math.random() * maxX + 'px';
this.style.top = Math.random() * maxY + 'px';
            } else if (noClickCount >= 5 && noClickCount < 8) {
                this.style.position = 'absolute';
                var padding = 100;

var container = document.getElementById('content');

var maxX = container.clientWidth - this.offsetWidth;
var maxY = container.clientHeight - this.offsetHeight;

this.style.position = 'absolute';
this.style.left = Math.random() * maxX + 'px';
this.style.top = Math.random() * maxY + 'px';
            } else if (noClickCount >= 8 && noClickCount < 13) {
                // Avoid disabling the button
                // this.disabled = true;
                this.style.position = 'absolute';
                var padding = 100;

var container = document.getElementById('content');

var maxX = container.clientWidth - this.offsetWidth;
var maxY = container.clientHeight - this.offsetHeight;

this.style.position = 'absolute';
this.style.left = Math.random() * maxX + 'px';
this.style.top = Math.random() * maxY + 'px';
                document.getElementById('message').innerText = 'Are you sure?';
                document.getElementById('message').style.position = 'absolute';
                document.getElementById('message').style.left = this.style.left;
                document.getElementById('message').style.top = parseFloat(this.style.top) + 50 + 'px';
            } else if (noClickCount == 13) {
                document.getElementById('message').innerText = 'Oh No! You broke the button :c';
                this.disabled = true;
                this.style.color = "grey";
                document.getElementById('message').innerText = 'Oh No! You broke the button :c';
            }
        });

        document.getElementById('yesButton').addEventListener('click', function() { 
            document.getElementById('message').innerText = '';                //YESSSS button
            document.getElementById('question').innerHTML = `
<p>Zvakanaka! You have successfully accepted your boyfriend duties 😘</p>

<p>🎉 Date Details:</p>

<p>📍 FEFU Island</p>
<p>🕖 2:00 PM</p>
<p>🌈 Picnic</p>
<p>👾 Games and fun</p>
<p>❤️ You + Me</p>
`;
            for (var i = 0; i < 100; i++) {
                var heart = document.createElement('div');
                heart.className = 'heart';
                heart.style.left = Math.random() * window.innerWidth + 'px';
                heart.style.animationDuration = Math.random() * 2 + 3 + 's'; //between 3 and 5 secs
                heart.style.animationDelay = Math.random() * 2 + 's'; // eto 0 and 2. di ko sure kung sure na
                document.body.appendChild(heart);
            }
            document.getElementById('yesButton').style.display = 'none';
            document.getElementById('noButton').style.display = 'none';
        });
    </script>
</body>
</html>
